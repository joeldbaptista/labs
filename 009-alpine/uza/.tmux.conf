# Prefix to Ctrl+b

# Move around panes with prefix + h/j/k/l (left, down, up, right)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Open a new window with prefix + w
bind w new-window

# Jump to the n-th window using Alt + n (if it exists)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Resize panes with prefix + arrow keys
bind -r Up resize-pane -U 2
bind -r Down resize-pane -D 2
bind -r Left resize-pane -L 2
bind -r Right resize-pane -R 2

# Set control bar colors (status line)
set -g status-bg black
set -g status-fg white

# Toggle the control bar visibility with prefix+s (hide) and prefix+S (show)
bind s set-option status off
bind S set-option status on

# Reload the configuration file (optional shortcut)
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

